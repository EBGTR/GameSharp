<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triko Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #161b22;
            border-right: 1px solid #30363d;
            padding: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #58a6ff;
        }

        .room {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background: #21262d;
            color: white;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
        }

        .room:hover,
        .room.active {
            background: #1f6feb;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .header h2 {
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #8b949e;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            margin-bottom: 18px;
        }

        .message-info {
            margin-bottom: 5px;
        }

        .username {
            font-weight: bold;
            color: #58a6ff;
        }

        .time {
            margin-left: 8px;
            color: #8b949e;
            font-size: 12px;
        }

        .message-text {
            display: inline-block;
            max-width: 700px;
            padding: 12px 15px;
            background: #21262d;
            border-radius: 4px 14px 14px 14px;
            line-height: 1.5;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            background: #161b22;
            border-top: 1px solid #30363d;
        }

        #usernameInput {
            width: 140px;
        }

        input {
            padding: 13px;
            border: 1px solid #30363d;
            border-radius: 10px;
            background: #0d1117;
            color: white;
            outline: none;
            font-size: 15px;
        }

        #messageInput {
            flex: 1;
        }

        input:focus {
            border-color: #58a6ff;
        }

        #sendButton {
            padding: 0 24px;
            border: none;
            border-radius: 10px;
            background: #238636;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #2ea043;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            #usernameInput {
                width: 100px;
            }

            .input-area {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            Triko<span>Chat</span>
        </div>

        <button class="room active">💬 Genel Sohbet</button>
        <button class="room">🎮 Oyunlar</button>
        <button class="room">🛠️ Projeler</button>
    </aside>

    <main class="chat">

        <header class="header">
            <h2>Genel Sohbet</h2>
            <p>Triko Chat'e hoş geldin!</p>
        </header>

        <section class="messages" id="messages">
            <div class="message">
                <div class="message-info">
                    <span class="username">Triko Bot</span>
                    <span class="time">Şimdi</span>
                </div>

                <div class="message-text">
                    Selam! İlk mesajını aşağıdan gönderebilirsin. 😄
                </div>
            </div>
        </section>

        <div class="input-area">
            <input
                id="usernameInput"
                type="text"
                placeholder="Kullanıcı adı"
                maxlength="20"
            >

            <input
                id="messageInput"
                type="text"
                placeholder="Bir mesaj yaz..."
                maxlength="300"
            >

            <button id="sendButton">Gönder</button>
        </div>

    </main>

</div>

<script>
    const usernameInput = document.getElementById("usernameInput");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function sendMessage() {
        const username = usernameInput.value.trim();
        const text = messageInput.value.trim();

        if (username === "") {
            alert("Önce kullanıcı adını yaz!");
            usernameInput.focus();
            return;
        }

        if (text === "") {
            messageInput.focus();
            return;
        }

        const now = new Date();

        const time = now.toLocaleTimeString("tr-TR", {
            hour: "2-digit",
            minute: "2-digit"
        });

        const messageElement = document.createElement("div");
        messageElement.className = "message";

        const messageInfo = document.createElement("div");
        messageInfo.className = "message-info";

        const usernameElement = document.createElement("span");
        usernameElement.className = "username";
        usernameElement.textContent = username;

        const timeElement = document.createElement("span");
        timeElement.className = "time";
        timeElement.textContent = time;

        const messageText = document.createElement("div");
        messageText.className = "message-text";
        messageText.textContent = text;

        messageInfo.appendChild(usernameElement);
        messageInfo.appendChild(timeElement);

        messageElement.appendChild(messageInfo);
        messageElement.appendChild(messageText);

        messages.appendChild(messageElement);

        messageInput.value = "";
        messageInput.focus();

        messages.scrollTop = messages.scrollHeight;
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
